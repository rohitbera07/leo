name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --list
      - run: node dist/index.js smoke-node --template express-mongodb --no-install
      - run: node dist/index.js smoke-python --template fastapi-postgres --no-install
      - run: test -f smoke-node/.gitignore
      - run: test -f smoke-python/.gitignore
